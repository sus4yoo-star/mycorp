name: Smoke

# Ask the deployed site what it actually serves, on demand.
# The same check runs at the end of every deploy; this is for asking again
# without shipping anything.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: what answers
        env:
          APP_URL: ${{ secrets.MYCORP24_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::MYCORP24_APP_URL is not set — nothing to probe."
            exit 0
          fi
          scripts/smoke.sh

  netlify:
    name: why is netlify refusing us
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ask netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::Netlify secrets are not set — nothing to ask."
            exit 0
          fi
          scripts/netlify-check.sh
